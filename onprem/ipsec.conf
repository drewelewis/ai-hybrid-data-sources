# OpenWrt (MX4300) strongSwan config for Azure S2S — Option B (lean)
# Copy to /etc/ipsec.conf on the router. Replace the two placeholders:
#   <AZURE_VPN_GATEWAY_PUBLIC_IP>  = azd output VPN_GATEWAY_PUBLIC_IP
#   <ONPREM_PUBLIC_IP_OR_FQDN>     = your public IP (69.123.141.164) or DDNS FQDN
#
# Proposals below match the Azure connection's custom IPsec policy exactly:
#   IKE : AES256 / SHA256 / DH group 14 (modp2048)
#   ESP : AES256 / SHA256 / no PFS

config setup
    charondebug="ike 1, knl 1, cfg 0"
    uniqueids=yes

conn azure
    keyexchange=ikev2
    type=tunnel
    authby=secret
    auto=start

    # Left = this site (OpenWrt). %defaultroute uses the WAN interface; NAT-T handles double-NAT.
    left=%defaultroute
    leftid=<ONPREM_PUBLIC_IP_OR_FQDN>
    leftsubnet=192.168.50.0/24

    # Right = Azure VPN Gateway
    right=<AZURE_VPN_GATEWAY_PUBLIC_IP>
    rightid=<AZURE_VPN_GATEWAY_PUBLIC_IP>
    rightsubnet=10.100.0.0/16

    ike=aes256-sha256-modp2048!
    esp=aes256-sha256!

    ikelifetime=28800s
    lifetime=3600s
    keyingtries=%forever

    # Dead Peer Detection keeps the NAT mapping open when OpenWrt is the initiator.
    dpdaction=restart
    dpddelay=30s
    dpdtimeout=150s

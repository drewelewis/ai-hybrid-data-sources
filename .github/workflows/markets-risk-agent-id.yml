name: Markets Risk Agent ID rollout

run-name: >-
  Markets Risk Agent ID ${{ inputs.operation || 'validate' }}
  ${{ inputs.instance || 'all' }}

on:
  pull_request:
    paths:
      - .github/workflows/markets-risk-agent-id.yml
      - A365/devops.md
      - lob/markets/markets-risk-analyst/identities/**
  workflow_dispatch:
    inputs:
      instance:
        description: Agent Identity instance to plan or apply
        required: true
        type: choice
        options:
          - local
          - dev
          - tst
          - prd
      operation:
        description: Plan reads tenant state; apply also mutates it after approval
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      confirmation:
        description: For apply, enter APPLY followed by the instance, for example APPLY dev
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    markets-risk-agent-id-${{
      github.event_name == 'workflow_dispatch' && inputs.instance || github.ref
    }}
  cancel-in-progress: false

env:
  IDENTITY_ROOT: lob/markets/markets-risk-analyst
  PYTHON_VERSION: "3.12"
  TARGET_INSTANCE: >-
    ${{ github.event_name == 'workflow_dispatch' && inputs.instance || 'local' }}

jobs:
  validate:
    name: Validate desired state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      trust-boundary: ${{ steps.target.outputs.trust-boundary }}
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.IDENTITY_ROOT }}/identities/requirements.txt

      - name: Install desired-state tooling
        run: >-
          python -m pip install
          --disable-pip-version-check
          --requirement identities/requirements.txt
        working-directory: ${{ env.IDENTITY_ROOT }}

      - name: Run renderer and provisioner tests
        run: >-
          python -m pytest
          identities/test_render.py
          identities/test_provision.py
          -q
        working-directory: ${{ env.IDENTITY_ROOT }}

      - name: Render every instance deterministically
        run: >-
          python -m identities.render
          --all
          --output-directory "${RUNNER_TEMP}/markets-risk-identities"
        working-directory: ${{ env.IDENTITY_ROOT }}

      - name: Select the protected trust boundary
        id: target
        shell: bash
        run: |
          if [[ "${TARGET_INSTANCE}" == prd* ]]; then
            echo "trust-boundary=prd" >> "${GITHUB_OUTPUT}"
          else
            echo "trust-boundary=nonprod" >> "${GITHUB_OUTPUT}"
          fi

  plan:
    name: Plan against Microsoft Entra
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: markets-risk-agent-id-plan
    permissions:
      contents: read
      id-token: write
    env:
      ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
      ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
      AGENT_ID_PRINCIPAL_MAP_JSON: ${{ vars.AGENT_ID_PRINCIPAL_MAP_JSON }}
    steps:
      - name: Require the protected main branch
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Tenant-aware planning is allowed only from main." >&2
            exit 1
          fi

      - name: Check out the reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.IDENTITY_ROOT }}/identities/requirements.txt

      - name: Install desired-state tooling
        run: >-
          python -m pip install
          --disable-pip-version-check
          --requirement identities/requirements.txt
        working-directory: ${{ env.IDENTITY_ROOT }}

      - name: Create the tenant-aware plan
        run: >-
          python -m identities.provision
          plan
          --instance "${TARGET_INSTANCE}"
          --source-commit "${GITHUB_SHA}"
          --output "${RUNNER_TEMP}/markets-risk-agent-id-plan/plan.json"
        working-directory: ${{ env.IDENTITY_ROOT }}

      - name: Upload the immutable plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: markets-risk-agent-id-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/markets-risk-agent-id-plan/plan.json
          if-no-files-found: error
          retention-days: 30

      - name: Validate plan integrity
        run: >-
          python -m identities.provision
          check-plan
          --plan "${RUNNER_TEMP}/markets-risk-agent-id-plan/plan.json"
        working-directory: ${{ env.IDENTITY_ROOT }}

      - name: Require an applicable plan before apply
        if: inputs.operation == 'apply'
        run: >-
          python -m identities.provision
          check-plan
          --plan "${RUNNER_TEMP}/markets-risk-agent-id-plan/plan.json"
          --require-applicable
        working-directory: ${{ env.IDENTITY_ROOT }}

  apply:
    name: Apply approved Agent ID plan
    if: inputs.operation == 'apply'
    needs:
      - validate
      - plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: markets-risk-agent-id-${{ needs.validate.outputs.trust-boundary }}
    permissions:
      contents: read
      id-token: write
    env:
      ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
      ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
      AGENT_ID_PRINCIPAL_MAP_JSON: ${{ vars.AGENT_ID_PRINCIPAL_MAP_JSON }}
    steps:
      - name: Require explicit apply confirmation
        shell: bash
        env:
          APPLY_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          expected="APPLY ${TARGET_INSTANCE}"
          if [[ "${APPLY_CONFIRMATION}" != "${expected}" ]]; then
            echo "Apply confirmation must exactly match: ${expected}" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Agent ID apply is allowed only from the main branch." >&2
            exit 1
          fi

      - name: Check out the planned source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download the approved plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: markets-risk-agent-id-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/markets-risk-agent-id-plan

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.IDENTITY_ROOT }}/identities/requirements.txt

      - name: Install desired-state tooling
        run: >-
          python -m pip install
          --disable-pip-version-check
          --requirement identities/requirements.txt
        working-directory: ${{ env.IDENTITY_ROOT }}

      - name: Revalidate the approved plan
        run: >-
          python -m identities.provision
          check-plan
          --plan "${RUNNER_TEMP}/markets-risk-agent-id-plan/plan.json"
          --require-applicable
        working-directory: ${{ env.IDENTITY_ROOT }}

      - name: Apply and independently read back core Agent ID objects
        run: >-
          python -m identities.provision
          apply
          --instance "${TARGET_INSTANCE}"
          --source-commit "${GITHUB_SHA}"
          --plan "${RUNNER_TEMP}/markets-risk-agent-id-plan/plan.json"
          --evidence
          "${RUNNER_TEMP}/markets-risk-agent-id-evidence/evidence.json"
        working-directory: ${{ env.IDENTITY_ROOT }}

      - name: Upload sanitized read-back evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: markets-risk-agent-id-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/markets-risk-agent-id-evidence/evidence.json
          if-no-files-found: warn
          retention-days: 90

# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: ai-hybrid-data-sources
metadata:
  template: ai-hybrid-data-sources-optionb@0.1.0

# Option B: network-level S2S connectivity plus the APIM Premium v2 control plane
# (VNet-injected, Internal mode) that fronts both egress (models) and ingress (on-prem data).
infra:
  provider: bicep
  path: infra
  module: main

# After `azd up` provisions the hub, deploy a network-isolated Foundry spoke (foundry-samples
# template 19) and peer it in BY DEFAULT, so `azd up` stands up the whole solution. Interactive
# prompt defaults to Yes; opt out by answering No, in CI, or when AZD_SKIP_FOUNDRY=true.
# Teardown stays manual (azd down is NOT hooked).
hooks:
  preup:
    posix:
      shell: sh
      run: ./scripts/select-deployment-configuration.sh
      interactive: true
    windows:
      shell: pwsh
      run: ./scripts/select-deployment-configuration.ps1
      interactive: true
  preprovision:
    posix:
      shell: sh
      run: ./scripts/validate-azure-context.sh
      interactive: false
    windows:
      shell: pwsh
      run: ./scripts/validate-azure-context.ps1
      interactive: false
  postup:
    posix:
      shell: sh
      run: ./scripts/setup-foundry.sh
      interactive: true
      continueOnError: true
    windows:
      shell: pwsh
      run: ./scripts/setup-foundry.ps1
      interactive: true
      continueOnError: true

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Agent ID token and Agent 365 telemetry flow</title>
  <desc id="desc">A five-step sequence where an agent runtime obtains a child Agent Identity token from Microsoft Entra ID and exports identity-attributed telemetry to Microsoft Agent 365.</desc>
  <defs>
    <marker id="blueArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#6c8ebf"/></marker>
    <marker id="purpleArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#9673a6"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#82b366"/></marker>
    <style>
      .box { stroke-width: 2; rx: 10; }
      .label { font: 700 15px Arial, sans-serif; text-anchor: middle; }
      .detail { font: 12px Arial, sans-serif; text-anchor: middle; }
      .step { font: 13px Arial, sans-serif; fill: #2c3e50; text-anchor: middle; }
      .lifeline { stroke-width: 2; stroke-dasharray: 7 6; }
      .arrow { fill: none; stroke-width: 2.5; }
    </style>
  </defs>
  <rect width="1200" height="620" fill="#f7f7f7"/>
  <rect class="box" x="90" y="50" width="250" height="90" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="215" y="79" class="label" fill="#1f4e79">Agent runtime</text>
  <text x="215" y="103" class="detail" fill="#1f4e79">Blueprint credential</text>
  <text x="215" y="123" class="detail" fill="#1f4e79">Target Agent Identity ID</text>

  <rect class="box" x="475" y="50" width="250" height="90" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="600" y="83" class="label" fill="#4a235a">Microsoft Entra ID</text>
  <text x="600" y="110" class="detail" fill="#4a235a">Agent ID token service</text>

  <rect class="box" x="860" y="50" width="250" height="90" fill="#d5e8d4" stroke="#82b366"/>
  <text x="985" y="83" class="label" fill="#285c2d">Microsoft Agent 365</text>
  <text x="985" y="110" class="detail" fill="#285c2d">Observability endpoint</text>

  <line x1="215" y1="140" x2="215" y2="560" class="lifeline" stroke="#6c8ebf"/>
  <line x1="600" y1="140" x2="600" y2="560" class="lifeline" stroke="#9673a6"/>
  <line x1="985" y1="140" x2="985" y2="560" class="lifeline" stroke="#82b366"/>

  <line x1="215" y1="205" x2="600" y2="205" class="arrow" stroke="#6c8ebf" marker-end="url(#blueArrow)"/>
  <text x="407" y="190" class="step">1. Request parent token using blueprint proof and fmi_path</text>

  <line x1="600" y1="280" x2="215" y2="280" class="arrow" stroke="#9673a6" marker-end="url(#purpleArrow)"/>
  <text x="407" y="265" class="step">2. Return parent token scoped to the child identity</text>

  <line x1="215" y1="355" x2="600" y2="355" class="arrow" stroke="#6c8ebf" marker-end="url(#blueArrow)"/>
  <text x="407" y="340" class="step">3. Exchange parent token as the Agent Identity</text>

  <line x1="600" y1="430" x2="215" y2="430" class="arrow" stroke="#9673a6" marker-end="url(#purpleArrow)"/>
  <text x="407" y="415" class="step">4. Return final Agent 365 access token</text>

  <line x1="215" y1="505" x2="985" y2="505" class="arrow" stroke="#82b366" marker-end="url(#greenArrow)"/>
  <text x="600" y="490" class="step">5. Export telemetry attributed to the Agent Identity</text>
</svg>
